services:
  host:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.host
    environment:
      - DATA_SOURCE=file:/data/a2a_platform.db?cache=shared&_journal_mode=WAL
    volumes:
      - host-data:/data
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7860/api/capabilities"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  fake-agent-a:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.agent
    environment:
      - PORT=10001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:10001/.well-known/agent.json"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    ports:
      - "10001:10001"

  fake-agent-b:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.agent
    environment:
      - PORT=10002
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:10002/.well-known/agent.json"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    ports:
      - "10002:10002"

  llm-agent:
    build:
      context: ..
      dockerfile: e2e/llm_agent/Dockerfile
    environment:
      - PORT=10003
      - LLM_BASE_URL=https://token-plan-cn.xiaomimimo.com/v1
      - LLM_API_KEY=tp-cvg1l8m7kmdevg8xts5j9qt34i9tpvxdj5o57q668da3g5om
      - LLM_MODEL=mimo-v2.5-pro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:10003/.well-known/agent.json"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    ports:
      - "10003:10003"

  e2e-test:
    build:
      context: ..
      dockerfile: e2e/docker-e2e-test.Dockerfile
    environment:
      - HOST_URL=http://host:7860
      - FAKE_AGENT_A_URL=http://fake-agent-a:10001
      - FAKE_AGENT_B_URL=http://fake-agent-b:10002
      - LLM_AGENT_URL=http://llm-agent:10003
    depends_on:
      host:
        condition: service_healthy
      fake-agent-a:
        condition: service_healthy
      fake-agent-b:
        condition: service_healthy
      llm-agent:
        condition: service_healthy

volumes:
  host-data:
